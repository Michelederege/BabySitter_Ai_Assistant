name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime, voice, and packaging libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-voice.txt
      - name: Run offscreen tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
      - name: Build standalone BabySitter.exe
        run: python -m PyInstaller packaging/babysitter.spec --noconfirm
      # Phase 7. Signing runs only when the two repository secrets exist:
      # WINDOWS_CERT_PFX (the .pfx file, base64) and WINDOWS_CERT_PASSWORD.
      # Without them the exe is published unsigned, as before, and the
      # in-app updater refuses the unsigned installer.
      - name: Load the code-signing certificate
        id: cert
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
        run: |
          if ($env:CERT_PFX) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
            "present=true" >> $env:GITHUB_OUTPUT
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            Write-Host "No signing certificate in the repository secrets. Publishing unsigned."
          }
      - name: Sign BabySitter.exe
        if: steps.cert.outputs.present == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "x64" } | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "dist/BabySitter.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signing BabySitter.exe failed." }
      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "installer/BabySitter.iss"
          if ($LASTEXITCODE -ne 0) { throw "The installer did not build." }
          Copy-Item (Get-ChildItem "dist-installer/BabySitter-Setup-*.exe" | Select-Object -First 1).FullName "dist/"
      - name: Sign the installer
        if: steps.cert.outputs.present == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match "x64" } | Select-Object -Last 1
          $setup = Get-ChildItem "dist/BabySitter-Setup-*.exe" | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signing the installer failed." }
      - name: Remove the certificate file
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\cert.pfx" -ErrorAction SilentlyContinue
      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $lines = foreach ($file in Get-ChildItem "dist/*.exe") {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $($file.Name)"
          }
          $lines | Set-Content -Encoding utf8 -Path "dist/SHA256SUMS.txt"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabySitter-Windows
          path: |
            dist/BabySitter.exe
            dist/BabySitter-Setup-*.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BabySitter.exe
            dist/BabySitter-Setup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
