name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime, voice, and packaging libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-voice.txt
      - name: Run offscreen tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q
      - name: Build standalone BabySitter.exe
        run: python -m PyInstaller packaging/babysitter.spec --noconfirm
      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/BabySitter.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  BabySitter.exe" | Set-Content -Encoding utf8 -Path "dist/SHA256SUMS.txt"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabySitter-Windows
          path: |
            dist/BabySitter.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BabySitter.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
