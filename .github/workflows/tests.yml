name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries needed to open the Qt window offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libfontconfig1 libxcb1
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # The voice tests read audio as numpy arrays. numpy comes with the voice
      # libraries (requirements-voice.txt), which CI doesn't install, so four test
      # files failed to import and pytest stopped before running anything. A
      # separate command, because the files above are hash-checked.
      - name: Install numpy for the voice tests
        run: python -m pip install "numpy>=2.0.2,<3"
      - name: Test
        run: QT_QPA_PLATFORM=offscreen python -m pytest
